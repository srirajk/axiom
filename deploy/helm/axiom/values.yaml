nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

server:
  replicaCount: 1
  image:
    repository: axiom-server
    tag: local
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  javaToolOptions: "-Xmx768m"
  terminationGracePeriodSeconds: 45

admin:
  replicaCount: 1
  image:
    repository: axiom-admin
    tag: local
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

serviceAccount:
  create: true
  # Server ServiceAccount (default: the release fullname). Workload-identity annotations here apply to the
  # server only; no other component uses this account.
  name: ""
  annotations: {}
  # Separate accounts, so the admin UI, hook Jobs and test pods never inherit the server's identity.
  # Defaults: <fullname>-admin, -bootstrap, -preflight and -test. With create: false each falls back to "default"
  # unless a name is set. The bootstrap Job writes the policy runtime, so an S3 workload-identity role it needs
  # goes in bootstrap.annotations.
  admin:
    name: ""
    annotations: {}
  bootstrap:
    name: ""
    annotations: {}
  preflight:
    name: ""
    annotations: {}
  test:
    name: ""
    annotations: {}

service:
  serverPort: 8084
  adminPort: 8080

runtimeSecret:
  # This Secret is operator-owned and must exist before helm install.
  existingSecret: axiom-runtime
  keys:
    databasePassword: spring.datasource.password
    masterKey: iam.secrets.master-key
    adminPassword: axiom.bootstrap.admin-password
    redisPassword: spring.data.redis.password
    s3AccessKey: iam.policy-studio.runtime.s3.access-key
    s3SecretKey: iam.policy-studio.runtime.s3.secret-key

signingKey:
  # Immutable Secret created before helm install. Helm never stores or rotates private key material.
  existingSecret: axiom-signing-key
  privateJwkKey: signing-key.json
  publicJwksKey: jwks.json

bootstrap:
  tenant:
    id: meridian
    name: Meridian
    slug: meridian
  administrator:
    id: admin
    username: admin
    email: admin@meridian.com
  hookDeletePolicy: before-hook-creation,hook-succeeded
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 900

config:
  issuerUrl: https://identity.meridian.com
  adminPublicUrl: https://identity-admin.meridian.com
  policyStagingDir: /tmp/tenant-policy-staging
  corsAllowedOrigins: https://identity-admin.meridian.com
  federationMetadataAllowedHosts: ""
  approvedBusinessScopes: cards:incident.read,cards:freeze.propose
  ciam:
    localDemoChallengeDisclosure: false
    demoAdminActivation:
      enabled: false
      allowedTenant: ""
      allowedEmailDomain: ""
      allowedIssuer: ""
    tenantId: meridian
    customerClientId: ciam-card-customer-spa
    customerScopes: cards:incident.read
  # Secure defaults (IDP baseline): people sign in through the browser authorization-code flow. Enable the legacy
  # password-to-token endpoints (/auth/login, /auth/token) or persona impersonation only for an environment whose
  # scripts or test harness still depend on them; Axiom logs a startup warning when either is on.
  auth:
    legacyPasswordLogin: false
    impersonation: false
  # Interactive (person/customer) token policy. Per-client values may be set lower at client registration; the
  # maximum caps them. Refresh tokens are issued only to confidential web clients granted offline_access.
  oauth2:
    interactiveAccessTokenTtl: PT1H
    interactiveAccessTokenMaxTtl: PT1H
    refreshTokenTtl: PT8H
    refreshTokenMaxTtl: P30D

postgresql:
  host: axiom-postgresql
  port: 5432
  database: axiom
  username: axiom

redis:
  host: axiom-redis
  port: 6379
  database: 0
  passwordEnabled: false
  authorizationKeyPrefix: "axiom:oauth2"
  tenantNamespacePrefix: "axiom:tenant:"

cerbos:
  host: axiom-cerbos
  grpcPort: 3593
  image: ghcr.io/cerbos/cerbos:0.53.0
  version: 0.53.0

policyRuntime:
  # s3 is recommended for Kubernetes. Cerbos must use the same bucket through its blob driver.
  backend: s3
  s3:
    bucket: axiom-policy-runtime
    prefix: runtime
    endpoint: ""
    region: us-east-1
    pathStyle: false
    credentialsFromRuntimeSecret: false
  pvc:
    # The disk alternative requires an existing RWX claim shared with Cerbos.
    existingClaim: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

tests:
  enabled: true
