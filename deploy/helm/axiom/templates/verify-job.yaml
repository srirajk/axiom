apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "axiom.fullname" . }}-verify
  labels:
    {{- include "axiom.labels" . | nindent 4 }}
    app.kubernetes.io/component: verify
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: {{ .Values.bootstrap.hookDeletePolicy | quote }}
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 2
  ttlSecondsAfterFinished: {{ .Values.bootstrap.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "axiom.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: verify
    spec:
      serviceAccountName: {{ include "axiom.serviceAccountName" . }}
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: {{ include "axiom.serverImage" . | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              wget -qO- http://{{ include "axiom.fullname" . }}:{{ .Values.service.serverPort }}/actuator/health/readiness | grep -q '"status":"UP"'
              wget -qO- http://{{ include "axiom.fullname" . }}:{{ .Values.service.serverPort }}/.well-known/openid-configuration | grep -q {{ .Values.config.issuerUrl | trimSuffix "/" | quote }}
              echo "Axiom readiness and issuer verification passed."
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
