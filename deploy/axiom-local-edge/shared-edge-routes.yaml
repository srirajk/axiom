apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: axiom-identity-shared-edge
  namespace: gateway-demo
spec:
  parentRefs:
    - name: argus-edge
      namespace: argus-edge
      sectionName: axiom-identity
  hostnames:
    - identity.meridian.com
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Port
                value: "8443"
      backendRefs:
        - name: axiom
          namespace: axiom
          port: 8084
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: axiom-admin-shared-edge
  namespace: gateway-demo
spec:
  parentRefs:
    - name: argus-edge
      namespace: argus-edge
      sectionName: axiom-admin
  hostnames:
    - identity-admin.meridian.com
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Port
                value: "8443"
      backendRefs:
        - name: axiom-admin
          namespace: axiom
          port: 8080
