apiVersion: v1
kind: Pod
metadata:
  name: axiom-local-network-canary
  namespace: axiom
  labels:
    app.kubernetes.io/name: axiom-local-network-canary
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 60
  nodeSelector:
    kubernetes.io/hostname: desktop-worker
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: canary
      image: redis:7-alpine
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec"]
      args:
        - |
          if ! nslookup axiom-redis.axiom.svc.cluster.local.; then
            echo "DNS_RESOLUTION_FAILED: cannot infer Redis isolation"
            exit 3
          fi
          echo "Redis Service DNS resolved."
          if timeout 3 redis-cli -h axiom-redis ping | grep -qx PONG; then
            echo "UNEXPECTED_REDIS_REACHABILITY: NetworkPolicy is not enforced"
            exit 2
          fi
          echo "Redis access denied to an unlabeled pod."
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
