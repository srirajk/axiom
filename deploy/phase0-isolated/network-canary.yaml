apiVersion: v1
kind: Pod
metadata:
  name: phase0-canary-server
  namespace: axiom-phase0-test
  labels:
    app.kubernetes.io/name: phase0-canary-server
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: server
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec"]
      args:
        - mkdir -p /tmp/www; printf 'isolated\n' > /tmp/www/index.html; exec httpd -f -p 8080 -h /tmp/www
      ports:
        - containerPort: 8080
          name: http
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: phase0-canary-server
  namespace: axiom-phase0-test
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: phase0-canary-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: phase0-canary-client
  namespace: axiom-phase0-test
  labels:
    app.kubernetes.io/name: phase0-canary-client
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "sleep 3600"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
