{{- include "axiom.validateValues" . }}
{{- if .Values.serviceAccount.create }}
{{- /* Server: name and annotations unchanged. Only the server pod uses it. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "axiom.serviceAccountName" . }}
  labels:
    {{- include "axiom.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- range $component := list "admin" "test" }}
{{- $settings := default (dict) (index $.Values.serviceAccount $component) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "axiom.componentServiceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "axiom.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $settings.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- /*
Bootstrap and preflight Jobs are pre-install/pre-upgrade hooks, which run before ordinary release resources exist,
so their ServiceAccounts are hooks with a lower weight. Helm (pkg/action/hooks.go execHook, v3.15) deletes
hook-succeeded resources only after every hook of the phase has succeeded, so each account exists for both Jobs and
is then removed: nothing, including any cloud-identity annotation, outlives a successful install or upgrade.
A failed phase leaves the account until the next install/upgrade (before-hook-creation) or the documented exact-name
recovery (deploy/helm/recover_hook_service_accounts.py).
*/}}
{{- range $component := list "bootstrap" "preflight" }}
{{- $settings := default (dict) (index $.Values.serviceAccount $component) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "axiom.componentServiceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "axiom.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with $settings.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
