apiVersion: v1
kind: ResourceQuota
metadata:
  name: phase0-quota
  namespace: axiom-phase0-test
spec:
  hard:
    pods: "12"
    services: "8"
    services.nodeports: "0"
    services.loadbalancers: "0"
    persistentvolumeclaims: "5"
    requests.storage: 10Gi
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "10"
    limits.memory: 12Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: phase0-limits
  namespace: axiom-phase0-test
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 10m
        memory: 32Mi
