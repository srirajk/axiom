apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "axiomdeps.name" . }}-policy-runtime
  {{- if .Values.persistence.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.policyRuntime.accessModes | nindent 4 }}
  {{- with .Values.policyRuntime.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.policyRuntime.size | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "axiomdeps.name" . }}-cerbos-audit
  {{- if .Values.persistence.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.cerbos.auditStorage.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.cerbos.auditStorage.size | quote }}
