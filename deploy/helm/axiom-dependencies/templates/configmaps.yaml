apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "axiomdeps.name" . }}-cerbos-config
data:
  config.yaml: |-
{{ .Files.Get "files/cerbos-config.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "axiomdeps.name" . }}-platform-policies
data:
{{- range $path, $_ := .Files.Glob "files/policies/*.yaml" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
