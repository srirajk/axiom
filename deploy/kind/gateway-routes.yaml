apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: axiom-identity-http
  namespace: gateway-demo
spec:
  parentRefs:
    - name: meridian-edge
      sectionName: axiom-identity-http
  hostnames: [identity.meridian.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 8443
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: axiom-identity-https
  namespace: gateway-demo
spec:
  parentRefs:
    - name: meridian-edge
      sectionName: axiom-identity-https
  hostnames: [identity.meridian.com]
  rules:
    - backendRefs:
        - name: axiom
          namespace: axiom
          port: 8084
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: axiom-admin-http
  namespace: gateway-demo
spec:
  parentRefs:
    - name: meridian-edge
      sectionName: axiom-admin-http
  hostnames: [identity-admin.meridian.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 8443
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: axiom-admin-https
  namespace: gateway-demo
spec:
  parentRefs:
    - name: meridian-edge
      sectionName: axiom-admin-https
  hostnames: [identity-admin.meridian.com]
  rules:
    - backendRefs:
        - name: axiom-admin
          namespace: axiom
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-meridian-gateway
  namespace: axiom
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: gateway-demo
  to:
    - group: ""
      kind: Service
      name: axiom
    - group: ""
      kind: Service
      name: axiom-admin
