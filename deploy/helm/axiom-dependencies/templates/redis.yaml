apiVersion: v1
kind: Service
metadata:
  name: {{ include "axiomdeps.name" . }}-redis
  labels:
    app.kubernetes.io/name: {{ include "axiomdeps.name" . }}-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "axiomdeps.name" . }}-redis
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "axiomdeps.name" . }}-redis
spec:
  serviceName: {{ include "axiomdeps.name" . }}-redis
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "axiomdeps.name" . }}-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "axiomdeps.name" . }}-redis
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: {{ include "axiomdeps.image" .Values.redis.image | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - {name: redis, containerPort: 6379}
          startupProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.redis.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.storage.size | quote }}
