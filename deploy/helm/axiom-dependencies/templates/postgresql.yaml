apiVersion: v1
kind: Service
metadata:
  name: {{ include "axiomdeps.name" . }}-postgresql
  labels:
    app.kubernetes.io/name: {{ include "axiomdeps.name" . }}-postgresql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "axiomdeps.name" . }}-postgresql
  ports:
    - {name: postgresql, port: 5432, targetPort: postgresql}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "axiomdeps.name" . }}-postgresql
spec:
  serviceName: {{ include "axiomdeps.name" . }}-postgresql
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "axiomdeps.name" . }}-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "axiomdeps.name" . }}-postgresql
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgresql
          image: {{ include "axiomdeps.image" .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - {name: postgresql, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }}}
            - {name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }}}
            - {name: POSTGRES_PASSWORD_FILE, value: /var/run/secrets/axiom/database-password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", {{ printf "pg_isready -U %s -d %s" .Values.postgresql.username .Values.postgresql.database | quote }}]
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", {{ printf "pg_isready -U %s -d %s" .Values.postgresql.username .Values.postgresql.database | quote }}]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", {{ printf "pg_isready -U %s -d %s" .Values.postgresql.username .Values.postgresql.database | quote }}]
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: runtime-secret, mountPath: /var/run/secrets/axiom/database-password, subPath: {{ .Values.runtimeSecret.databasePasswordKey | quote }}, readOnly: true}
            - {name: postgres-run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: runtime-secret
          secret:
            secretName: {{ .Values.runtimeSecret.existingSecret | quote }}
            defaultMode: 256
            items:
              - {key: {{ .Values.runtimeSecret.databasePasswordKey | quote }}, path: {{ .Values.runtimeSecret.databasePasswordKey | quote }}}
        - name: postgres-run
          emptyDir: {sizeLimit: 32Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size | quote }}
