{{- if .Values.guardrails.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "axiomdeps.name" . }}-quota
spec:
  hard:
    {{- toYaml .Values.guardrails.resourceQuota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "axiomdeps.name" . }}-limits
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .Values.guardrails.limitRange.default | nindent 8 }}
      defaultRequest:
        {{- toYaml .Values.guardrails.limitRange.defaultRequest | nindent 8 }}
      max:
        {{- toYaml .Values.guardrails.limitRange.max | nindent 8 }}
      min:
        {{- toYaml .Values.guardrails.limitRange.min | nindent 8 }}
{{- end }}
